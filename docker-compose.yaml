services:
  app:
    build: .
    command: gunicorn app:app --bind 0.0.0.0:5000 --workers 2 --timeout 180 --reload
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:?Define DATABASE_URL con la URL de tu Postgres cloud}
      SECRET_KEY: ${SECRET_KEY:-dev-docker-secret-change-me}
      PERMITIR_REGISTRO_PUBLICO: ${PERMITIR_REGISTRO_PUBLICO:-true}
      PERMITIR_RUTA_LOCAL: ${PERMITIR_RUTA_LOCAL:-true}
      PYTHONUNBUFFERED: "1"
    ports:
      - "${APP_PORT:-5050}:5000"
    volumes:
      - .:/app
      - uploads_data:/app/uploads
      - ${HOST_XMLS_DIR:-./xmls}:/host-xmls:ro

volumes:
  uploads_data:
