services:
  app:
    build: .
    command: >
      gunicorn app:app
      --bind 0.0.0.0:5000
      --workers ${WEB_CONCURRENCY:-1}
      --threads ${WEB_THREADS:-2}
      --timeout ${GUNICORN_TIMEOUT:-180}
      --max-requests ${GUNICORN_MAX_REQUESTS:-200}
      --max-requests-jitter ${GUNICORN_MAX_REQUESTS_JITTER:-50}
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SECRET_KEY: ${SECRET_KEY:-dev-docker-secret-change-me}
      PERMITIR_REGISTRO_PUBLICO: ${PERMITIR_REGISTRO_PUBLICO:-false}
      PERMITIR_RUTA_LOCAL: ${PERMITIR_RUTA_LOCAL:-false}
      MALLOC_ARENA_MAX: "2"
      PYTHONUNBUFFERED: "1"
    expose:
      - "5000"
    mem_limit: ${APP_MEMORY_LIMIT:-512m}
    cpus: ${APP_CPUS:-0.5}
    volumes:
      - uploads_data:/app/uploads

volumes:
  uploads_data:
